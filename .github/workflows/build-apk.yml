name: Build Lilo's Garden APK

on:
  push:
    branches:
      - main
      - master
      - remastered
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Synchronize Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html style.css app.js manifest.json sw.js favicon.png assets android/app/src/main/assets/www/
          echo "Successfully bundled web assets into android/app/src/main/assets/www/"

      - name: Synchronize App Icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          set -e -o pipefail
          chmod +x gradlew || true
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../build.log

      - name: Report Build Failure Summary
        if: failure()
        run: |
          LOGFILE="build.log"
          [ -f "$LOGFILE" ] || LOGFILE="android/build.log"
          [ -f "$LOGFILE" ] || LOGFILE="../build.log"
          echo "### Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 "$LOGFILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(e: |error: |Compilation error)" "$LOGFILE" | head -n 35 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=KotlinError::$line"
          done

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Copy APK for Direct Download
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./lilos-garden.apk
          echo "Successfully copied release APK to root lilos-garden.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilos-garden-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ./lilos-garden.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/remastered' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lilo's Garden Android APK"
          body: "Direct 1-tap download of Lilo's Garden Android APK (.apk) with offline sanctuary, Garden Widget, and Cat Bed & Clock Widget."
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            ./lilos-garden.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
