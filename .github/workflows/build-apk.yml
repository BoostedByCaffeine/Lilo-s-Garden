name: Build Lilo's Garden APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Synchronize Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html style.css app.js manifest.json sw.js favicon.png assets android/app/src/main/assets/www/
          echo "Successfully bundled web assets into android/app/src/main/assets/www/"

      - name: Synchronize App Icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew || true
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Initializing Gradle wrapper..."
            gradle wrapper --gradle-version 8.4 --distribution-type bin
            chmod +x gradlew
          fi
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Copy APK for Direct Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./lilos-garden.apk
          echo "Successfully copied debug APK to root lilos-garden.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilos-garden-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ./lilos-garden.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lilo's Garden Android APK"
          body: "Direct 1-tap download of Lilo's Garden Android APK (.apk) with offline sanctuary, Garden Widget, and Cat Bed & Clock Widget."
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ./lilos-garden.apk
        continue-on-error: true
