name: Build Lilo's Garden iOS (.ipa)

on:
  push:
    branches:
      - main
      - master
      - remastered
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Bundle Web Assets to iOS
        run: |
          mkdir -p ios/www
          cp -r index.html style.css app.js manifest.json sw.js favicon.png assets ios/www/
          echo "Successfully bundled web assets into ios/www/"

      - name: Generate Xcode Project with XcodeGen
        working-directory: ios
        run: |
          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild -project ios/LilosGarden.xcodeproj \
            -scheme LilosGarden \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LilosGarden.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package Unsigned .IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LilosGarden.xcarchive/Products/Applications/LilosGarden.app build/Payload/
          cd build
          zip -qr ../lilos-garden.ipa Payload
          cd ..
          echo "Created lilos-garden.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilos-garden-ipa
          path: ./lilos-garden.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/remastered' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lilo's Garden iOS (.ipa) & Android (.apk)"
          body: "Direct download of Lilo's Garden iOS IPA (.ipa for AltStore / SideStore / TrollStore / Scarlet) and Android APK."
          make_latest: true
          files: |
            ./lilos-garden.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
