name: Build Lilo's Garden iOS (.ipa)

on:
  push:
    branches:
      - main
      - master
      - remastered
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Installed Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen & Generate Project
        working-directory: ios
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          rm -rf LilosGarden.xcodeproj
          xcodegen generate
          # Safeguard: ensure project.pbxproj never uses future objectVersion 77 on Xcode 15 runners
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' LilosGarden.xcodeproj/project.pbxproj

      - name: Build Unsigned Release .app
        working-directory: ios
        run: |
          xcodebuild build \
            -project LilosGarden.xcodeproj \
            -scheme LilosGarden \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Ad-Hoc Sign & Package into lilos-garden-ios.ipa
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LilosGarden.app"
          if [ -d "$APP_PATH/PlugIns/LilosGardenWidgets.appex" ]; then
            codesign --force --sign - --timestamp=none "$APP_PATH/PlugIns/LilosGardenWidgets.appex"
          fi
          codesign --force --sign - --timestamp=none "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r9 lilos-garden-ios.ipa Payload
          cp lilos-garden-ios.ipa lilos-garden.ipa

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilos-garden-ios-ipa
          path: |
            ios/lilos-garden-ios.ipa
            ios/lilos-garden.ipa

      - name: Publish lilos-garden-ios.ipa to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lilo's Garden — Latest Android APK & iOS IPA"
          files: |
            ios/lilos-garden-ios.ipa
            ios/lilos-garden.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
