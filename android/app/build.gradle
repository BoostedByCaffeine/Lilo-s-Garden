plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNumber = System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 10

android {
    namespace 'com.valois.lilosgarden'
    compileSdk 34

    defaultConfig {
        applicationId "com.valois.lilosgarden"
        minSdk 26
        targetSdk 34
        versionCode 100 + runNumber
        versionName "1.2.${runNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        persistentConfig {
            storeFile file("lilos-garden.keystore")
            storePassword "lilosgarden123"
            keyAlias "lilosgarden"
            keyPassword "lilosgarden123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.persistentConfig
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.persistentConfig
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets {
                srcDirs 'src/main/assets'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
