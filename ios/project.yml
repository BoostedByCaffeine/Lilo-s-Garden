name: LilosGarden
options:
  bundleIdPrefix: com.valois.lilosgarden
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  LilosGarden:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LilosGarden
      - path: www
        type: folder
        buildPhase: resources
    entitlements:
      path: LilosGarden/LilosGarden.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valois.lilosgarden
        INFOPLIST_FILE: LilosGarden/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: LilosGardenWidgets

  LilosGardenWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LilosGardenWidgets
    entitlements:
      path: LilosGardenWidgets/LilosGardenWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valois.lilosgarden.widgets
        INFOPLIST_FILE: LilosGardenWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - framework: WidgetKit.framework
      - framework: SwiftUI.framework
